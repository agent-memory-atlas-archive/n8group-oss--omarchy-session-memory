name: release

# Runs on GitHub-hosted runners, deliberately — the same reason ci.yml does.
#
# This repository is going public. A workflow that ran on the maintainer's own
# machine would hand an anonymous contributor's pull request the maintainer's
# infrastructure, and a release workflow is the worst place of all to make that
# trade: it is the job that holds a token which can publish. There is no
# `self-hosted` here, and `ci.yml` has a job that fails if one ever appears.
#
# Every action is pinned to a full commit SHA and every container to an image
# digest, for the same reason and with more force. `actions/checkout@v4` and
# `rust:1-bookworm` are references someone else can move; whoever moves one
# chooses what runs in this workflow, and this workflow builds the binary users
# download. A step that replaced the binary would produce a checksum matching
# its own tampering, so the published checksum proves the artifact survived the
# trip and nothing at all about where it came from. A commit SHA and an image
# digest cannot be pointed at other content; a tag is a promise, and the version
# comment after each `@` says which promise was reviewed.
#
# What a user actually verifies against is the SHA-256 in `install.sh` at the
# repository root — part of the commit the Omarchy marketplace validated, and
# written there by hand *after* a release, because the digest of a build does
# not exist before the build. See "Cutting a release" in README.md.
#
# The cost is deliberate: nothing here picks up a new Rust or a patched action
# on its own. Refreshing a pin is an edit to this file, with the version
# comment updated, and `tests/workflows.rs` fails if one is ever left as a tag.
#
# What this cannot do is stop a *future* workflow from being added unpinned.
# That is `Require actions to be pinned to a full-length commit SHA` in the
# repository's Actions settings, which is the maintainer's to switch on.

on:
  push:
    tags:
      - "v*"
  # A manual run builds, checks the versions agree, and publishes nothing.
  # It exists so this workflow can be exercised without minting a tag, which
  # is not a thing you can take back.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    # Debian bookworm, not the ubuntu-latest host: a binary links against the
    # glibc it was built on and refuses to start on anything older. The runner
    # image is Ubuntu 24.04 (glibc 2.39), which would exclude every Debian
    # stable and every LTS older than 24.04 for no gain. bookworm's 2.36 is
    # the oldest glibc this project's dependencies build against cleanly.
    #
    # By digest: `rust:1-bookworm` is republished, and the image the release
    # binary is compiled in is part of what a user is trusting.
    container:
      image: rust:1-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Three versions have to agree before anything is built, let alone
      # published: the tag, the crate, and the plugin manifest. A release
      # whose manifest says 0.1.0 under a v0.2.0 tag installs a plugin that
      # reports the wrong engine version to every user who reads the menu,
      # and there is no way to correct a tag that has been fetched.
      #
      # `tests/manifest.rs` already keeps the crate and the manifest together
      # on every commit. The tag is the part only a release can check.
      - name: The tag, the crate and the manifest must agree
        shell: bash --noprofile --norc {0}
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -u
          crate="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/["]/,"");print $3;exit}' Cargo.toml)"
          manifest="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' manifest.json | head -n1)"
          echo "crate=$crate manifest=$manifest tag=${TAG:-<none>}"
          fail=0
          if [ -z "$crate" ] || [ -z "$manifest" ]; then
            echo "FAIL: could not read a version out of Cargo.toml or manifest.json"
            fail=1
          fi
          if [ "$crate" != "$manifest" ]; then
            echo "FAIL: Cargo.toml says $crate, manifest.json says $manifest"
            fail=1
          fi
          if [ -n "$TAG" ]; then
            if [ "$TAG" != "v$crate" ]; then
              echo "FAIL: tag $TAG does not name version $crate (expected v$crate)"
              fail=1
            fi
          else
            echo "not a tag: this run checks the versions and publishes nothing"
          fi
          exit "$fail"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release

      # --locked: the release is built from the committed Cargo.lock and
      # nothing else, so the binary a user downloads is the one the test
      # matrix ran against.
      - name: Build
        run: cargo build --release --locked --bin osm

      # The checksum, and only the checksum.
      #
      # This step used to also generate an `install.sh` carrying this build's
      # digest, which the release published and the panel told users to
      # download. The marketplace's security review of 58cc3f4 rejected that
      # chain: the script and the digest it claimed came from the same mutable
      # release, so replacing the release — or taking the publisher's account
      # — changes both together, and the reviewed plugin contained nothing to
      # contradict either. The trust anchor was inside the artifact it was
      # vouching for.
      #
      # `install.sh` now lives at the repository root, in the tree the
      # marketplace validates, and `omarchy plugin add` git-clones it onto the
      # user's machine along with the QML. This workflow deliberately does not
      # publish a second copy: one would reopen the flagged path for anyone
      # who found it on the releases page, and it could not even be made
      # correct — at the moment this tag is pushed, the in-tree script still
      # names the *previous* release's digest, because the digest of this
      # build does not exist until this step has run. Writing the published
      # digest back into install.sh is a commit after the release, and
      # README.md's "Cutting a release" spells the order out.
      #
      # The `.sha256` stays published. It is a convenience for a person
      # comparing by hand, and it is what
      # `tests/installer.rs::the_in_tree_digest_is_the_one_that_release_published`
      # reads to check the in-tree anchor from outside. It is not what the
      # installer verifies against, and a sibling test forbids it ever
      # becoming so: a checksum served by whoever served the binary proves the
      # download was not corrupted and nothing else.
      - name: Checksum
        shell: bash --noprofile --norc {0}
        run: |
          set -eu
          mkdir -p dist
          cp target/release/osm dist/osm-x86_64-unknown-linux-gnu
          cd dist
          sha256sum osm-x86_64-unknown-linux-gnu > osm-x86_64-unknown-linux-gnu.sha256
          ls -l

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osm-x86_64-unknown-linux-gnu
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    # Tags only. A manual run stops after `build`, having proved the thing
    # builds and the versions agree, without creating anything.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout. This is the one job holding a token that can publish, and
    # nothing in it reads the source tree: the artifact arrives from `build`,
    # and `gh release create --repo "$GITHUB_REPOSITORY"` asks GitHub rather
    # than a working copy. A checkout here would be one more action running
    # with `contents: write` for no work.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: osm-x86_64-unknown-linux-gnu
          path: dist

      # Re-verified on this side of the artifact hop. The checksum is the
      # thing users are asked to trust, so it is checked against the file it
      # travels with rather than assumed to have survived.
      - name: The checksum still matches what was built
        shell: bash --noprofile --norc {0}
        run: |
          set -eu
          cd dist
          sha256sum -c osm-x86_64-unknown-linux-gnu.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/osm-x86_64-unknown-linux-gnu \
            dist/osm-x86_64-unknown-linux-gnu.sha256
